name: Update ratings data

on:
  workflow_dispatch:

  schedule:
    # Sunday 01:05 Greece summer time / 00:05 Greece winter time
    # GitHub Actions cron runs in UTC.
    - cron: "05 22 * * 6"

permissions:
  contents: write
  actions: read

concurrency:
  group: update-ratings
  cancel-in-progress: false

jobs:
  update-history:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas

      - name: Check required secret
        env:
          PLACES_API_KEY: ${{ secrets.PLACES_API_KEY }}
        run: |
          if [ -z "${PLACES_API_KEY}" ]; then
            echo "Missing PLACES_API_KEY secret"
            exit 1
          fi

      - name: Update history.json
        env:
          PLACES_API_KEY: ${{ secrets.PLACES_API_KEY }}
        run: python courier_ratings.py

      - name: Commit updated history.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add history.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "auto: update history data"
            git push origin main
          fi